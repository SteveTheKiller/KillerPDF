name: PR build and tests

on:
  pull_request:
    branches: [main, dev/1.9-overkill]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Hosted Windows runners do not certify interactive desktop automation.
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            project: KillerPDF.csproj
            mode: build
            framework: ''
          - name: application-tests
            project: KillerPDF.Tests/KillerPDF.Tests.csproj
            mode: test
            framework: ''
          - name: engine-tests
            project: engine/KillerPdf.Engine.Tests/KillerPdf.Engine.Tests.csproj
            mode: test
            framework: ''
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build
        env:
          PROJECT: ${{ matrix.project }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          dotnet --info
          dotnet restore $env:PROJECT --verbosity minimal 2>&1 | Tee-Object ci-results/restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed. See restore.log.' }
          $buildArgs = @('build', $env:PROJECT, '--no-restore', '--configuration', 'Release', '--verbosity', 'minimal')
          if ($env:FRAMEWORK) { $buildArgs += @('--framework', $env:FRAMEWORK) }
          & dotnet @buildArgs 2>&1 | Tee-Object ci-results/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed. See build.log.' }
      - name: Run tests
        if: matrix.mode == 'test'
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          # WPF FontCache requires WINDIR even for isolated resource tests.
          if (!$env:WINDIR) { $env:WINDIR = $env:SYSTEMROOT }
          dotnet test $env:PROJECT --no-build --no-restore --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory ci-results --verbosity normal 2>&1 | Tee-Object ci-results/test.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed. See test.log and tests.trx.' }
      - name: Retain failure diagnostics and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ matrix.name }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7

  forward-port-coverage:
    # main PRs introduce work that cannot have a development commit record yet.
    # This check covers the proposed development tree against current main.
    if: github.base_ref == 'dev/1.9-overkill'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check maintenance commit coverage (not semantic verification)
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          & ./build/Check-MaintenanceForwardPorts.ps1 -MaintenanceRef origin/main -DevelopmentRef HEAD 2>&1 | Tee-Object ci-results/forward-ports.log
          if ($LASTEXITCODE -ne 0) { throw 'Forward-port coverage failed. See missing hashes in forward-ports.log; adapted ports require reviewed commit records and tests.' }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forward-port-coverage
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
