name: PR build and tests

# Also runs on pushes to development branches, so a candidate is checked before any PR exists.
# No secrets are used; the token can only read the repository.
on:
  pull_request:
    branches: [main]
  push:
    branches: ['dev/**']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Hosted Windows runners do not certify interactive desktop automation.
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            project: KillerPDF.csproj
            mode: build
            framework: ''
          - name: application-tests
            project: KillerPDF.Tests/KillerPDF.Tests.csproj
            mode: test
            framework: ''
          - name: engine-tests
            project: engine/KillerPdf.Engine.Tests/KillerPdf.Engine.Tests.csproj
            mode: test
            framework: ''
          - name: ui-smoke-fixture
            project: tests/KillerPDF.UiSmoke/KillerPDF.UiSmoke.csproj
            mode: build
            framework: ''
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build
        env:
          PROJECT: ${{ matrix.project }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          dotnet --info
          dotnet restore $env:PROJECT --verbosity minimal 2>&1 | Tee-Object ci-results/restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed. See restore.log.' }
          $buildArgs = @('build', $env:PROJECT, '--no-restore', '--configuration', 'Release', '--verbosity', 'minimal')
          if ($env:FRAMEWORK) { $buildArgs += @('--framework', $env:FRAMEWORK) }
          & dotnet @buildArgs 2>&1 | Tee-Object ci-results/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed. See build.log.' }
      - name: Verify website shortcut data
        if: matrix.name == 'application'
        run: |
          dotnet run --project tools/KillerPDF.ShortcutSite/KillerPDF.ShortcutSite.csproj --configuration Release -- "$env:GITHUB_WORKSPACE" --check 2>&1 | Tee-Object ci-results/shortcuts.log
          if ($LASTEXITCODE -ne 0) { throw 'Website shortcuts differ from the app. See shortcuts.log.' }
      - name: Verify WinGet release notes fit the manifest
        if: matrix.name == 'application'
        run: |
          & ./build/Test-WinGetReleaseNotes.ps1 2>&1 | Tee-Object ci-results/winget-release-notes.log
      - name: Verify final release artifact gates offline
        if: matrix.name == 'application'
        run: |
          foreach ($mode in @('unsigned-store', 'missing-store-payload', 'unsigned-store-inner', 'mismatched-store-version', 'valid-store', 'checksum-create', 'checksum-replaced-store', 'checksum-missing-store', 'checksum-unchanged-store')) {
            $evidence = Join-Path $env:RUNNER_TEMP ('killerpdf-artifact-' + $mode + '-' + [guid]::NewGuid().ToString('N'))
            try {
              & ./build/Test-ReleaseArtifactVerification.ps1 -Mode $mode -EvidenceRoot $evidence 2>&1 | Tee-Object ("ci-results/release-artifacts-$mode.log")
            } finally {
              if (Test-Path -LiteralPath $evidence) { Copy-Item -LiteralPath $evidence -Destination ("ci-results/release-artifacts-$mode") -Recurse }
            }
          }
      - name: Build the app the CLI tests launch
        if: matrix.name == 'application-tests'
        run: |
          dotnet build KillerPDF.csproj --configuration Release --verbosity minimal 2>&1 | Tee-Object ci-results/test-app-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Test app build failed. See test-app-build.log.' }
      - name: Run tests
        if: matrix.mode == 'test'
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          # WPF FontCache requires WINDIR even for isolated resource tests.
          if (!$env:WINDIR) { $env:WINDIR = $env:SYSTEMROOT }
          dotnet test $env:PROJECT --no-build --no-restore --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory ci-results --verbosity normal 2>&1 | Tee-Object ci-results/test.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed. See test.log and tests.trx.' }
      - name: Verify synthetic PDF fixture without a window
        if: matrix.name == 'ui-smoke-fixture'
        run: |
          if (!$env:WINDIR) { $env:WINDIR = $env:SYSTEMROOT }
          # This job needs the compiled app but never starts App.OnStartup or UI automation.
          dotnet build KillerPDF.csproj --configuration Release --verbosity minimal 2>&1 | Tee-Object ci-results/fixture-app-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Fixture app build failed. See fixture-app-build.log.' }
          dotnet run --project tests/KillerPDF.UiSmoke/KillerPDF.UiSmoke.csproj --configuration Release --no-build --no-restore -- --verify-fixture bin/Release/net10.0-windows/KillerPDF.dll ci-results/fixture 2>&1 | Tee-Object ci-results/fixture.log
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic PDF regression failed. See fixture.log and fixture/host-error.txt.' }
      - name: Retain failure diagnostics and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ matrix.name }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
